name: Changed Files Playwright API Checks

on:
  pull_request:
    branches:
      - main
permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  playwright-automation-checks:
    timeout-minutes: 10
    runs-on: ubuntu-latest

    env:
      BASE_URL: ${{ github.event.inputs.base_url }}

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v3
        with:
          node-version: 22

      - name: Cache node_modules
        uses: actions/cache@v3
        id: node-modules-cache
        with:
          path: |
            node_modules
          key: modules-${{ hashFiles('package-lock.json') }}
      - run: npm ci --ignore-scripts
        if: steps.node-modules-cache.outputs.cache-hit != 'true'

      - name: Run lint
        run: npm run lint
      - name: Run prettier
        run: npm run prettier

      - name: Set BASE_URL if not passed in
        if: env.BASE_URL == null
        run: |
          echo "BASE_URL=https://automationintesting.online/api/" >> $GITHUB_ENV

      # --only-changed only follows TypeScript imports. Changes to config, dependencies,
      # JSON schemas (loaded via dynamic require), env files, or workflows are invisible
      # to it and can select zero tests, so run the full suite when any of those change.
      - name: Decide test scope
        id: scope
        run: |
          changed=$(git diff --name-only "origin/$GITHUB_BASE_REF...HEAD")
          echo "Changed files:"
          echo "$changed"
          if echo "$changed" | grep -qE '^(playwright\.config\.ts|package(-lock)?\.json|tsconfig\.json|\.api/|\.env|\.github/workflows/)'; then
            echo "Shared files changed, running the full suite"
            echo "only_changed=" >> "$GITHUB_OUTPUT"
          else
            echo "Running only tests affected by changed files"
            echo "only_changed=--only-changed=origin/$GITHUB_BASE_REF" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Playwright tests
        run: |
          echo "The github event is: ${{ github.event_name }}"
          URL=${{ env.BASE_URL }} npx playwright test --grep-invert @unsatisfactory --reporter=github,html --workers=1 ${{ steps.scope.outputs.only_changed }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
